services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: plant
      POSTGRES_PASSWORD: plant
      POSTGRES_DB: plantdocs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant -d plantdocs"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
